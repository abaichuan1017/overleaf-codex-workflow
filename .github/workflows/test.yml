name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safety-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax, workflow, and installation integration checks
        run: bash tests/run.sh
